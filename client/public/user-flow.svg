<svg width="700" height="960" viewBox="0 0 700 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .nt { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
    .ntw { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #ffffff; }
    .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 400; fill: #6b7280; }
    .dt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
    .ly { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #059669; }
    .ln { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #dc2626; }
    .lw { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 500; fill: #9ca3af; font-style: italic; }
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#9ca3af"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#059669"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#ef4444"/></marker>
  </defs>

  <!-- 1. Start -->
  <rect x="150" y="20" width="220" height="50" rx="25" fill="#1f2937"/>
  <text x="260" y="40" text-anchor="middle" class="ntw">Employee submits</text>
  <text x="260" y="55" text-anchor="middle" class="ntw" style="font-size:11px">new project</text>
  <line x1="260" y1="70" x2="260" y2="108" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>

  <!-- 2. Pending Conflict -->
  <rect x="150" y="110" width="220" height="62" rx="12" fill="#bbf7d0" stroke="#86efac" stroke-width="1.5"/>
  <text x="260" y="136" text-anchor="middle" class="nt">Pending Conflict</text>
  <text x="260" y="156" text-anchor="middle" class="sub">Emails sent to all employees</text>
  <line x1="260" y1="172" x2="260" y2="218" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>

  <!-- 3. Diamond: All clear? -->
  <polygon points="260,220 325,258 260,296 195,258" fill="#bfdbfe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="260" y="262" text-anchor="middle" class="dt">All clear?</text>

  <!-- 3’4 Yes (down) -->
  <line x1="260" y1="296" x2="260" y2="348" stroke="#059669" stroke-width="2" marker-end="url(#ag)"/>
  <text x="245" y="328" text-anchor="end" class="ly">Yes</text>

  <!-- 3’A No (right to Conflict Review) -->
  <path d="M325,258 L530,258 L530,348" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="345" y="250" class="ln">No</text>

  <!-- 4. Pending EA / Retainer -->
  <rect x="150" y="350" width="220" height="50" rx="12" fill="#bbf7d0" stroke="#86efac" stroke-width="1.5"/>
  <text x="260" y="380" text-anchor="middle" class="nt">Pending EA / Retainer</text>
  <line x1="260" y1="400" x2="260" y2="443" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>

  <!-- A. Conflict Review (right) -->
  <rect x="420" y="350" width="220" height="50" rx="12" fill="#fef08a" stroke="#fde047" stroke-width="1.5"/>
  <text x="530" y="380" text-anchor="middle" class="nt">Conflict Review</text>
  <line x1="530" y1="400" x2="530" y2="443" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>

  <!-- B. Diamond: Cleared? -->
  <polygon points="530,445 590,478 530,511 470,478" fill="#bfdbfe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="530" y="482" text-anchor="middle" class="dt">Cleared?</text>

  <!-- B’4 Yes (left + up to Pending EA) -->
  <path d="M470,478 L400,478 L400,375 L370,375" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  <text x="455" y="468" text-anchor="end" class="ly">Yes</text>

  <!-- B No label -->
  <text x="598" y="468" class="ln">No</text>
  <text x="598" y="482" class="lw">(remains in review)</text>

  <!-- 5. Diamond: EA tasks complete? -->
  <polygon points="260,445 330,483 260,521 190,483" fill="#bfdbfe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="260" y="479" text-anchor="middle" class="dt" style="font-size:11px">EA tasks</text>
  <text x="260" y="493" text-anchor="middle" class="dt" style="font-size:11px">complete?</text>

  <!-- 5’6 Yes -->
  <line x1="260" y1="521" x2="260" y2="568" stroke="#059669" stroke-width="2" marker-end="url(#ag)"/>
  <text x="245" y="550" text-anchor="end" class="ly">Yes</text>

  <!-- 6. Active -->
  <rect x="150" y="570" width="220" height="50" rx="12" fill="#bbf7d0" stroke="#86efac" stroke-width="1.5"/>
  <text x="260" y="600" text-anchor="middle" class="nt">Active</text>
  <line x1="260" y1="620" x2="260" y2="648" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>

  <!-- 7. Report Issued -->
  <rect x="150" y="650" width="220" height="50" rx="12" fill="#bbf7d0" stroke="#86efac" stroke-width="1.5"/>
  <text x="260" y="680" text-anchor="middle" class="nt">Report Issued</text>
  <line x1="260" y1="700" x2="260" y2="728" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>

  <!-- 8. Hold -->
  <rect x="150" y="730" width="220" height="50" rx="12" fill="#fef08a" stroke="#fde047" stroke-width="1.5"/>
  <text x="260" y="760" text-anchor="middle" class="nt">Hold</text>
  <line x1="260" y1="780" x2="260" y2="808" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>

  <!-- 9. Closed -->
  <rect x="150" y="810" width="220" height="50" rx="12" fill="#bbf7d0" stroke="#86efac" stroke-width="1.5"/>
  <text x="260" y="840" text-anchor="middle" class="nt">Closed</text>
  <line x1="260" y1="860" x2="260" y2="888" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>

  <!-- 10. Archived -->
  <rect x="150" y="890" width="220" height="50" rx="12" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="260" y="920" text-anchor="middle" class="nt">Archived</text>
</svg>
